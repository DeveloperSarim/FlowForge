name: Bug report
description: Something in FlowForge doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: FlowForge version
      description: Settings → Updates shows it.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Hosting
      options:
        - Hostinger hPanel
        - cPanel
        - DirectAdmin
        - VPS / cloud server
        - Local machine
        - Other
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3"
  - type: textarea
    id: logs
    attributes:
      label: Error log
      description: The last lines of storage/logs/laravel.log, if there's an error. Remove any passwords or keys first.
      render: text
