name: Feature or app request
description: Suggest a feature, or an app you'd like FlowForge to connect to.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: The feature or the app (with a link to its API docs), and what you'd use it for.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you handle this today?
